              "119":("ai_roles","TOLL代價與後遺症預測師"),
              "120":("ai_roles","CLAUSE法務合規審查官"),
              "121":("ai_roles","六顧問交詰辯論"),
              "122":("life","自由行行程規劃顧問"),
              "123":("routine","政府採購法｜排程監測指令"),
              "124":("routine","政府採購法｜條文深度解析"),
              "125":("routine","政府採購法｜定期報告格式"),
              "126":("proposal","NABC系列提案模組"),
          }

          # ── 讀取 _INIT_COUNTS 作為基準 ────────────────────────────────
          INIT_COUNTS = {
              "1":18,"3":6,"4":8,"5":7,"6":7,"7":7,"8":16,"9":9,
              "10":14,"11":11,"12":14,"13":11,"14":8,"15":8,"16":9,
              "17":9,"18":9,"19":22,"20":8,"21":8,"22":11,"23":10,
              "24":9,"25":9,"26":11,"27":8,"28":5,"29":10,"30":11,
              "31":10,"32":11,"33":9,"34":10,"35":8,"36":9,"37":8,
              "38":10,"39":9,"40":11,"41":7,"43":7,"44":6,"45":7,
              "46":6,"47":6,"48":7,"49":6,"50":7,"51":7,"52":6,
              "53":9,"54":9,"55":8,"56":9,"57":8,"58":8,"59":9,
              "60":8,"61":9,"62":8,"63":8,"64":8,"65":9,"66":7,
              "67":8,"68":6,"69":7,"70":6,"71":6,"72":7,"73":6,
              "74":22,"75":9,"76":9,"77":10,"78":10,"79":10,"80":9,
              "81":18,"82":6,"83":9,"84":7,"85":10,"86":10,"87":10,
              "88":9,"89":7,"90":11,"91":9,"92":8,"102":9,"103":10,
              "104":8,"105":9,"106":9,"107":9,"108":9,"109":10,
              "110":5,"111":5,"112":5,"113":5,"114":5,
              "115":5,"116":5,"117":5,"118":5,"119":5,"120":5,"121":5,
              "122":5,"123":5,"124":5,"125":5,"126":5,
          }

          WORKER_URL = 'https://prompt-hub-counter.wonchen-chang.workers.dev'

          # ── 從 Cloudflare Worker 讀取今日計數 ─────────────────────────
          import urllib.request as _req
          snapshot_path = 'counts-snapshot.json'
          try:
              r = _req.urlopen(WORKER_URL + '/counts', timeout=15)
              today_counts = json.loads(r.read().decode())
              # 合併 INIT_COUNTS：取兩者最大值
              merged = dict(INIT_COUNTS)
              for k, v in today_counts.items():
                  merged[k] = max(int(merged.get(k,0)), int(v))
              today_counts = merged
              print(f"✅ Worker 讀取成功，{len(today_counts)} 筆")
          except Exception as e:
              print(f"⚠️ Worker 讀取失敗（{e}），使用初始值")
              today_counts = dict(INIT_COUNTS)

          # 讀取昨日快照（用 snapshot 的 today 作為昨日基準，不用 yesterday）
          old_today_counts = {}   # 昨天 Worker 的累計值（今天計算差值用）
          try:
              with open(snapshot_path) as f:
                  snap = json.load(f)
              # 用 snap['today'] 作為昨日基準（上次執行時存的 Worker 值）
              old_today_counts = snap.get('today', {})
              print(f"✅ 昨日快照讀取成功，基準值 {len(old_today_counts)} 筆")
          except Exception as e:
              print(f"⚠️ 昨日快照讀取失敗（{e}），差值將以 INIT_COUNTS 為基準")
              old_today_counts = dict(INIT_COUNTS)
          yesterday_counts = old_today_counts

          # ── 計算各分類增量 ────────────────────────────────────────────
          cat_today = {}
          cat_delta = {}
          top_prompts = []

          for pid, cnt in today_counts.items():
              cnt   = int(cnt)
              prev  = int(yesterday_counts.get(pid, INIT_COUNTS.get(pid, 0)))
              delta = max(0, cnt - prev)
              info  = PROMPTS.get(pid)
              if not info: continue
              cat, title = info
              cat_today[cat] = cat_today.get(cat, 0) + cnt
              cat_delta[cat] = cat_delta.get(cat, 0) + delta
              if delta > 0:
                  top_prompts.append((delta, title, cat))

          top_prompts.sort(reverse=True)
          total_today = sum(int(v) for v in today_counts.values())
          total_delta = sum(cat_delta.values())

          # ── 建立郵件 ──────────────────────────────────────────────────
          lines = [
              "📊 Prompt Hub 每日使用報告",
              f"日期：{today}",
              "─" * 44,
              f"累計複製總數：{total_today}　　今日新增：+{total_delta}",
              "─" * 44,
              "",
              "【各分類今日新增次數】",
          ]
          for cat, delta in sorted(cat_delta.items(), key=lambda x: -x[1]):
              label = CAT_LABELS.get(cat, cat)
              total = cat_today.get(cat, 0)
              bar   = "▓" * min(delta, 15)
              lines.append(f"  {label:<14} +{delta:3d}  (累計 {total:4d})  {bar}")

          lines += ["", "【今日最熱門提示詞 Top 10】"]
          if top_prompts:
              for i, (delta, title, cat) in enumerate(top_prompts[:10], 1):
                  label = CAT_LABELS.get(cat, cat)
                  lines.append(f"  {i:2d}. +{delta} 次  {title}  [{label}]")
          else:
              lines.append("  今日尚無新增記錄")

          lines += ["", "─" * 44, "Prompt Hub · wonchenchang-AIhub.github.io"]
          body_text = "\n".join(lines)

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"📊 Prompt Hub 日報 {today}  新增 +{total_delta} 次"
          msg["From"]    = GMAIL_USER
          msg["To"]      = NOTIFY_TO
          msg.attach(MIMEText(body_text, "plain", "utf-8"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(GMAIL_USER, GMAIL_PASS)
              smtp.sendmail(GMAIL_USER, NOTIFY_TO, msg.as_bytes())
          print(f"✅ 日報寄送完成（{today}）總計 {total_today}  新增 +{total_delta}")

          # ── 更新快照（today 存 Worker 最新值，yesterday 存前次 today）──
          new_snapshot = {
              'today':     dict(today_counts),       # 本次 Worker 值，明日作為昨日基準
              'yesterday': dict(old_today_counts),   # 前次 Worker 值，留存記錄
              'updated':   today
          }
          with open(snapshot_path, 'w') as f:
              json.dump(new_snapshot, f, ensure_ascii=False, indent=2)
          print("✅ counts-snapshot.json 已更新")
          PYEOF

      - name: 提交快照更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counts-snapshot.json
          git diff --staged --quiet || git commit -m "chore: daily snapshot $(date +'%Y-%m-%d')"
          git push
