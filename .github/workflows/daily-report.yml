              "115":("ai_roles","VETO決策合理性審計官"),
              "116":("ai_roles","SCAR組織政治與人性獵手"),
              "117":("ai_roles","GRIP執行現實校驗官"),
              "118":("ai_roles","LENS資訊完整性稽核員"),
              "119":("ai_roles","TOLL代價與後遺症預測師"),
              "120":("ai_roles","CLAUSE法務合規審查官"),
              "121":("ai_roles","六顧問交詰辯論"),
              "122":("life","自由行行程規劃顧問"),
              "123":("routine","政府採購法｜排程監測指令"),
              "124":("routine","政府採購法｜條文深度解析"),
              "125":("routine","政府採購法｜定期報告格式"),
              "126":("proposal","NABC系列提案模組"),
          }

          # ── 讀取 JSONBin 計數 ─────────────────────────────────────────
          def bin_read():
              req = urllib.request.Request(
                  BIN_URL + '/latest',
                  headers={
                      'X-Master-Key': JSONBIN_KEY,
                      'X-Access-Key': JSONBIN_ACCESS_KEY,
                      'X-Bin-Meta': 'false'
                  }
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode())

          def bin_write(payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  BIN_URL,
                  data=data,
                  method='PUT',
                  headers={
                      'Content-Type': 'application/json',
                      'X-Master-Key': JSONBIN_KEY
                  }
              )
              with urllib.request.urlopen(req, timeout=15): pass

          # 讀取今日計數
          try:
              record          = bin_read()
              today_counts    = record.get('counts', {})
              yesterday_counts = record.get('yesterday_snapshot', {})
              print(f"✅ JSONBin 讀取成功，{len(today_counts)} 筆")
          except Exception as e:
              print(f"❌ JSONBin 讀取失敗：{e}")
              exit(1)

          # ── 計算各分類增量 ────────────────────────────────────────────
          cat_today = {}
          cat_delta = {}
          top_prompts = []

          for pid, cnt in today_counts.items():
              cnt   = int(cnt)
              prev  = int(yesterday_counts.get(pid, 0))
              delta = max(0, cnt - prev)
              info  = PROMPTS.get(pid)
              if not info: continue
              cat, title = info
              cat_today[cat] = cat_today.get(cat, 0) + cnt
              cat_delta[cat] = cat_delta.get(cat, 0) + delta
              if delta > 0:
                  top_prompts.append((delta, title, cat))

          top_prompts.sort(reverse=True)
          total_today = sum(int(v) for v in today_counts.values())
          total_delta = sum(cat_delta.values())

          # ── 建立郵件 ──────────────────────────────────────────────────
          lines = [
              f"📊 Prompt Hub 每日使用報告",
              f"日期：{today}",
              "─" * 44,
              f"累計複製總數：{total_today}　　今日新增：+{total_delta}",
              "─" * 44,
              "",
              "【各分類今日新增次數】",
          ]
          for cat, delta in sorted(cat_delta.items(), key=lambda x: -x[1]):
              label = CAT_LABELS.get(cat, cat)
              total = cat_today.get(cat, 0)
              bar   = "▓" * min(delta, 15)
              lines.append(f"  {label:<14} +{delta:3d}  (累計 {total:4d})  {bar}")

          lines += ["", "【今日最熱門提示詞 Top 10】"]
          if top_prompts:
              for i, (delta, title, cat) in enumerate(top_prompts[:10], 1):
                  label = CAT_LABELS.get(cat, cat)
                  lines.append(f"  {i:2d}. +{delta} 次  {title}  [{label}]")
          else:
              lines.append("  今日尚無新增記錄")

          lines += ["", "─" * 44, "Prompt Hub · wonchenchang-AIhub.github.io"]
          body_text = "\n".join(lines)

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"📊 Prompt Hub 日報 {today}  新增 +{total_delta} 次"
          msg["From"]    = GMAIL_USER
          msg["To"]      = NOTIFY_TO
          msg.attach(MIMEText(body_text, "plain", "utf-8"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(GMAIL_USER, GMAIL_PASS)
              smtp.sendmail(GMAIL_USER, NOTIFY_TO, msg.as_bytes())
          print(f"✅ 日報寄送完成（{today}）總計 {total_today}  新增 +{total_delta}")

          # ── 更新昨日快照 ───────────────────────────────────────────────
          record['yesterday_snapshot'] = dict(today_counts)
          bin_write(record)
          print("✅ 昨日快照已更新至 JSONBin")
          PYEOF
