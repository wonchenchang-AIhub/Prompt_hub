name: Prompt Hub 每日使用報告

on:
  schedule:
    - cron: '0 0 * * *'   # 每天台灣時間早上 8:00（UTC 00:00）
  workflow_dispatch:        # 手動觸發測試

permissions:
  contents: write           # 允許讀寫 repo 檔案

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 產生每日報告並寄送 Gmail
        env:
          GMAIL_USER: wonchen.chang@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: wonchen.chang@gmail.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: wonchenchang-AIhub/Prompt_hub
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime, timezone, timedelta

          GMAIL_USER = os.environ['GMAIL_USER']
          GMAIL_PASS = os.environ['GMAIL_APP_PASSWORD']
          NOTIFY_TO  = os.environ['NOTIFY_EMAIL']
          GH_TOKEN   = os.environ['GITHUB_TOKEN']
          REPO       = os.environ['REPO']

          TW    = timezone(timedelta(hours=8))
          today = datetime.now(TW).strftime('%Y/%m/%d')

          CAT_LABELS = {
              'preset':'⚙️ AI工具設定','decision':'📊 決策與分析',
              'proposal':'📋 企劃與提案','comms':'💼 職場溝通',
              'writing':'✍️ 文稿優化','ai_roles':'🧠 策略智囊',
              'industry':'📈 產業分析','sales':'💰 行銷銷售',
              'research':'🔬 研究分析','routine':'📅 日常效率',
              'learning':'🎓 學習成長','life':'✨ 生活娛樂',
          }

          PROMPTS = {
              "1":("preset","個人化預設提示詞"),
              "3":("decision","決策分析"),
              "4":("decision","方案分析與比較"),
              "5":("decision","決策分析與風險評估"),
              "6":("decision","風險管理"),
              "7":("decision","問題解決與分析"),
              "8":("industry","頂級分析師分析套路模組"),
              "9":("proposal","專案規劃分析"),
              "10":("proposal","問題釐清"),
              "11":("proposal","計畫提案自我審查"),
              "12":("proposal","商業提案企劃"),
              "13":("proposal","創新提案規劃"),
              "14":("comms","撰寫專業電子郵件"),
              "15":("comms","配合受眾改寫內容"),
              "16":("comms","草擬會議邀請"),
              "17":("comms","溝通談判"),
              "18":("comms","適法性評估"),
              "19":("writing","萬用校稿"),
              "20":("routine","每日任務排序"),
              "21":("routine","每日新聞摘要排程"),
              "22":("sales","萬用銷售Prompt模板"),
              "23":("sales","邀約Prompt"),
              "24":("sales","跟進Prompt"),
              "25":("sales","疑慮處理Prompt"),
              "26":("learning","高效學習模式"),
              "27":("sales","招募Prompt"),
              "28":("life","生成個人特製名片"),
              "29":("sales","沉默成交Prompt"),
              "30":("ai_roles","策略分析：Rex"),
              "31":("ai_roles","深度研究：Sage"),
              "32":("ai_roles","爆款行銷設計：Blaze"),
              "33":("writing","消除AI味：人類寫作風格"),
              "34":("writing","消除AI味：對話式語氣"),
              "35":("writing","消除AI味：個人聲音"),
              "36":("writing","消除AI味：自然流暢"),
              "37":("writing","消除AI味：可讀性提升"),
              "38":("research","研究助手"),
              "39":("ai_roles","差異化創新：Nova"),
              "40":("learning","學習教練：快速入門"),
              "41":("research","內容分析師"),
              "43":("research","素材主題盤點"),
              "44":("research","矛盾偵測"),
              "45":("research","跨受眾簡報"),
              "46":("research","問題生成器"),
              "47":("research","證據強度評級"),
              "48":("research","時間線重建"),
              "49":("research","反駁防禦"),
              "50":("research","知識缺口地圖"),
              "51":("research","洞察提取"),
              "52":("research","最終報告生成"),
              "53":("industry","市場規模評估"),
              "54":("industry","客戶畫像構建"),
              "55":("industry","競爭對手定位圖"),
              "56":("industry","定價策略逆向工程"),
              "57":("industry","行業趨勢報告"),
              "58":("industry","客戶訪談問題生成器"),
              "59":("industry","市場進入管道分析"),
              "60":("industry","高效問卷調查設計"),
              "61":("industry","SWOT分析"),
              "62":("routine","草擬工作進度報告"),
              "63":("routine","會議紀錄轉行動清單"),
              "64":("comms","跨部門協作溝通"),
              "65":("ai_roles","任務執行展開：Iris"),
              "66":("learning","蘇格拉底式學習教練"),
              "67":("learning","學習教練：概念分解"),
              "68":("research","尋找矛盾"),
              "69":("research","間隙分析"),
              "70":("research","尋找驚訝發現"),
              "71":("research","掌握核心主題"),
              "72":("research","紅隊測試"),
              "73":("research","正反辯證"),
              "74":("preset","AI自我檢討優化指令"),
              "75":("proposal","政府計畫書｜知識庫準備"),
              "76":("proposal","政府計畫書｜專案系統"),
              "77":("proposal","政府計畫書｜P1標案解構"),
              "78":("proposal","政府計畫書｜P2計畫緣起"),
              "79":("proposal","政府計畫書｜P3執行策略"),
              "80":("proposal","政府計畫書｜P4效益評估"),
              "81":("writing","專家審稿"),
              "82":("research","主題綜合分析"),
              "83":("industry","McKinsey一頁式總結"),
              "84":("research","深度報導與事實查核"),
              "85":("sales","報價草稿生成"),
              "86":("comms","客服回覆草稿"),
              "87":("sales","行銷貼文生成器"),
              "88":("routine","業務日報整理"),
              "89":("research","文件重點摘要"),
              "90":("sales","客戶追蹤話術生成"),
              "91":("routine","會議紀錄轉行動清單2"),
              "92":("proposal","AI工具導入評估"),
              "102":("proposal","創意發想引導師"),
              "103":("proposal","創意發想架構師"),
              "104":("proposal","聯想力訓練師"),
              "105":("proposal","創新解決方案設計師"),
              "106":("proposal","創意評估專家"),
              "107":("proposal","數據解讀專家"),
              "108":("proposal","商業機會分析師"),
              "109":("proposal","決策評估專家"),
          }

          # ── 讀取 app.js 裡的 _INIT_COUNTS 作為今日計數基準 ──────────────
          # 因為沒有外部服務，直接用 _INIT_COUNTS 做今日展示
          # 並讀取昨日快照做比對
          INIT_COUNTS = {
              "1":18,"3":6,"4":8,"5":7,"6":7,"7":7,"8":16,"9":9,
              "10":14,"11":11,"12":14,"13":11,"14":8,"15":8,"16":9,
              "17":10,"18":9,"19":22,"20":9,"21":8,"22":11,"23":10,
              "24":9,"25":9,"26":11,"27":8,"28":5,"29":10,"30":11,
              "31":10,"32":11,"33":9,"34":10,"35":8,"36":9,"37":8,
              "38":10,"39":9,"40":11,"41":7,"43":7,"44":6,"45":7,
              "46":6,"47":6,"48":7,"49":6,"50":7,"51":7,"52":6,
              "53":9,"54":9,"55":8,"56":9,"57":8,"58":8,"59":9,
              "60":8,"61":9,"62":8,"63":8,"64":8,"65":9,"66":7,
              "67":8,"68":6,"69":7,"70":6,"71":6,"72":7,"73":6,
              "74":22,"75":9,"76":9,"77":10,"78":10,"79":10,"80":9,
              "81":18,"82":6,"83":9,"84":7,"85":10,"86":10,"87":10,
              "88":9,"89":7,"90":11,"91":9,"92":8,"102":9,"103":10,
              "104":8,"105":9,"106":9,"107":9,"108":9,"109":10,
          }

          # 讀取昨日快照
          snapshot_path = 'counts-snapshot.json'
          try:
              with open(snapshot_path) as f:
                  yesterday = json.load(f)
          except:
              yesterday = {}

          # 合併：取今日初始值和昨日快照的最大值
          today_counts = {}
          for pid, val in INIT_COUNTS.items():
              today_counts[pid] = max(val, int(yesterday.get(pid, 0)))

          # 計算各分類數據
          cat_today = {}
          cat_delta = {}
          top_prompts = []

          for pid, cnt in today_counts.items():
              prev  = int(yesterday.get(pid, 0))
              delta = max(0, cnt - prev)
              info  = PROMPTS.get(pid)
              if not info: continue
              cat, title = info
              cat_today[cat] = cat_today.get(cat, 0) + cnt
              cat_delta[cat] = cat_delta.get(cat, 0) + delta
              if delta > 0:
                  top_prompts.append((delta, title, cat))

          top_prompts.sort(reverse=True)
          total_today = sum(today_counts.values())
          total_delta = sum(cat_delta.values())

          # ── 建立郵件 ──────────────────────────────────────────────────
          lines = [
              f"📊 Prompt Hub 每日使用報告",
              f"日期：{today}",
              "─" * 44,
              f"累計複製總數：{total_today}　　今日新增：+{total_delta}",
              "─" * 44,
              "",
              "【各分類今日新增次數】",
          ]

          for cat, delta in sorted(cat_delta.items(), key=lambda x: -x[1]):
              label = CAT_LABELS.get(cat, cat)
              total = cat_today.get(cat, 0)
              bar   = "▓" * min(delta, 15)
              lines.append(f"  {label:<14} +{delta:3d}  (累計 {total:4d})  {bar}")

          lines += ["", "【今日最熱門提示詞 Top 10】"]
          if top_prompts:
              for i, (delta, title, cat) in enumerate(top_prompts[:10], 1):
                  label = CAT_LABELS.get(cat, cat)
                  lines.append(f"  {i:2d}. +{delta} 次  {title}  [{label}]")
          else:
              lines.append("  今日尚無新增記錄（初始化日）")

          lines += [
              "",
              "─" * 44,
              "Prompt Hub · wonchenchang-AIhub.github.io",
          ]

          body_text = "\n".join(lines)

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"📊 Prompt Hub 日報 {today}  新增 +{total_delta} 次"
          msg["From"]    = GMAIL_USER
          msg["To"]      = NOTIFY_TO
          msg.attach(MIMEText(body_text, "plain", "utf-8"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(GMAIL_USER, GMAIL_PASS)
              smtp.sendmail(GMAIL_USER, NOTIFY_TO, msg.as_bytes())

          print(f"✅ 日報寄送完成（{today}）總計 {total_today}  新增 +{total_delta}")

          # ── 更新快照 ──────────────────────────────────────────────────
          with open(snapshot_path, 'w') as f:
              json.dump(today_counts, f)

          print("✅ 快照已更新至 counts-snapshot.json")
          PYEOF

      - name: 提交更新快照
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counts-snapshot.json
          git diff --staged --quiet || git commit -m "chore: update daily snapshot $(date +'%Y-%m-%d')"
          git push
